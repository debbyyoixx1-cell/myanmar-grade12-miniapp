<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>တက္ကသိုလ်ဝင်တန်း အောင်စာရင်း | Myanmar Grade 12</title>
    <meta name="description" content="တက္ကသိုလ်ဝင်တန်းစာမေးပွဲနှင့် စက်မှု/စိုက်ပျိုးရေး/မွေးမြူရေး အောင်စာရင်းကို ခုံအမှတ်နှင့် အလွယ်တကူ စစ်ဆေးပါ။" />
    <meta property="og:title" content="တက္ကသိုလ်ဝင်တန်း အောင်စာရင်း | Myanmar Grade 12" />
    <meta property="og:description" content="ခုံအမှတ်ရိုက်ထည့်ပြီး အောင်စာရင်းကို ချက်ချင်းစစ်ဆေးပါ။" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="icon" href="assets/monywa-denstar-welcome.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="guard.js"></script>
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <main class="shell">
      <!-- HOME -->
      <section class="screen" id="screen-home">
        <header class="hero">
          <img class="hero-logo" src="assets/monywa-denstar-welcome.png" alt="Myanmar Grade 12 Bot" draggable="false" />
          <h1>တက္ကသိုလ်ဝင်တန်း အောင်စာရင်း</h1>
          <p>ခုံအမှတ်ရိုက်ထည့်ရုံနှင့် အောင်/မအောင် ချက်ချင်းသိနိုင်ပါသည်။</p>
        </header>

        <div class="cards">
          <button class="card" type="button" data-exam="matric">
            <span class="card-ico">🎓</span>
            <span class="card-body">
              <strong>တက္ကသိုလ်ဝင်စာမေးပွဲ</strong>
              <small>Matriculation အောင်စာရင်း</small>
            </span>
            <span class="card-arrow">›</span>
          </button>
          <button class="card" type="button" data-exam="betal">
            <span class="card-ico">🌾</span>
            <span class="card-body">
              <strong>စက်မှု၊ စိုက်ပျိုးရေး၊ မွေးမြူရေး</strong>
              <small>အထူးအောင်စာရင်း (B/E/M/A/L)</small>
            </span>
            <span class="card-arrow">›</span>
          </button>
        </div>

        <nav class="links">
          <button class="linkbtn" type="button" data-link="support">Support</button>
          <button class="linkbtn" type="button" data-link="bot">Bot</button>
          <button class="linkbtn" type="button" data-link="owner">Owner</button>
        </nav>
      </section>

      <!-- FORM -->
      <section class="screen hidden" id="screen-form">
        <button class="back" type="button" id="btn-back">‹ နောက်သို့</button>
        <h2 id="form-title">တက္ကသိုလ်ဝင်စာမေးပွဲ</h2>

        <label class="field">
          <span>ခုံအမှတ် (အက္ခရာ)</span>
          <input id="in-alpha" list="alpha-list" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ဥပမာ - မနတ" />
          <datalist id="alpha-list"></datalist>
        </label>

        <label class="field">
          <span>ခုံအမှတ် (ကိန်းဂဏန်း)</span>
          <input id="in-roll" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="ဥပမာ - 125" />
        </label>

        <p class="hint" id="form-hint"></p>
        <button class="primary" type="button" id="btn-check">စစ်ဆေးမည်</button>
      </section>

      <!-- SUSPENSE -->
      <section class="screen hidden" id="screen-load">
        <div class="magic" id="magic">🪄</div>
        <div class="bar"><i id="bar-fill"></i></div>
        <p class="hint center">ရှာဖွေနေပါသည် ...</p>
      </section>

      <!-- RESULT -->
      <section class="screen hidden" id="screen-result">
        <img class="result-img" id="result-img" alt="result" draggable="false" />
        <h2 id="result-title"></h2>
        <div class="rows" id="result-rows"></div>
        <button class="primary" type="button" id="btn-again">ထပ်စစ်ဆေးမည်</button>
        <nav class="links">
          <button class="linkbtn" type="button" data-share="story">📸 Share Story</button>
          <button class="linkbtn" type="button" data-share="friend">📤 Share Friend</button>
        </nav>
        <p class="hint center" id="share-hint"></p>
      </section>

      <footer class="foot">Monywa DENSTAR</footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
